name: UI Tests

on:
  push:
    branches: [ main, develop, feature/* ]
    paths:
      - 'pokeinfo-client/**'
      - '.github/workflows/ui-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'pokeinfo-client/**'

jobs:
  ui-tests:
    name: Run Cypress UI Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./pokeinfo-client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'pokeinfo-client/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Start development server
        run: |
          npm run dev > /tmp/vite.log 2>&1 &
          echo $! > /tmp/vite.pid
        shell: bash
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'http://localhost:3000' }}

      - name: Wait for dev server
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:5173 > /dev/null 2>&1; then
              echo "✅ Dev server is ready!"
              exit 0
            fi
            echo "⏳ Waiting for dev server... ($i/120)"
            sleep 1
          done
          echo "❌ Dev server failed to start"
          echo "--- Vite Log Output ---"
          cat /tmp/vite.log
          kill $(cat /tmp/vite.pid) 2>/dev/null || true
          exit 1
        shell: bash

      - name: Verify dev server and dependencies
        run: |
          echo "✅ Checking if server is accessible..."
          curl -v http://localhost:5173 || true
          echo ""
          echo "✅ Server process status:"
          ps aux | grep -E '[v]ite|[n]ode' || true
        shell: bash

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./pokeinfo-client
          browser: chrome
          command: npm run e2e:run
          install: false

      - name: Cleanup dev server
        if: always()
        run: |
          if [ -f /tmp/vite.pid ]; then
            kill $(cat /tmp/vite.pid) 2>/dev/null || true
          fi
          pkill -f "vite" || true
        shell: bash

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: pokeinfo-client/cypress/screenshots
          retention-days: 7

      - name: Upload videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: pokeinfo-client/cypress/videos
          retention-days: 7

  test-results:
    name: Test Results Summary
    runs-on: ubuntu-latest
    needs: ui-tests
    if: always()

    steps:
      - name: Check test status
        run: |
          if [ "${{ needs.ui-tests.result }}" = "success" ]; then
            echo "✅ All UI tests passed!"
            exit 0
          else
            echo "❌ UI tests failed"
            exit 1
          fi
